name: CI

# Runs on every push to main and on pull requests. Deployment is separate:
# the EC2 server pulls main itself (deploy/auto-deploy.sh) and the frontend
# deploys through Vercel. This workflow is the safety check before either.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migrate, seed, boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadgendb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leadgendb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/leadgendb
      SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q .

      - name: Run migrations on an empty database
        run: python -m alembic upgrade head

      - name: Seed sample data
        env:
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-only-password-1234
          ADMIN_NAME: CI Admin
        run: python seed.py

      - name: Boot the API and call it
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/ping && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/ping
          curl -fs http://127.0.0.1:8000/api/v1/home | grep -q '"success":true'
          curl -fs http://127.0.0.1:8000/api/v1/collections/homepage | grep -q '"success":true'

      - name: Docker image builds
        working-directory: .
        run: docker build -t career-backend:ci backend

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit
