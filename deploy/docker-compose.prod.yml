# Production stack for one EC2 host. Run from the deploy/ folder:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Step by step: docs/deployment-guide.md

name: career-platform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: leadgendb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" here. The database is never reachable from outside the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadgendb"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    depends_on:
      db:
        condition: service_healthy
    # Admin-uploaded images. A named volume survives rebuilds. On an on-prem host,
    # replace "uploads" with a bind mount (e.g. /data/career/uploads:/app/uploads).
    volumes:
      - uploads:/app/uploads
    # Internal only: Caddy is the sole client. No "ports:" here.
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
      args:
        # Public address the browser will call, baked in at build time.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        # While building, pages are prerendered from the public API. Map the domain to
        # this host so the build reaches Caddy here, not the internet. Needs Docker 20.10+.
      extra_hosts:
        - "${DOMAIN}:host-gateway"
    restart: unless-stopped
    environment:
      # Server-side form forwarding goes straight to the backend on the internal network.
      ENQUIRY_FORWARD_URL: http://backend:8000/api/v1/leads
      REGISTER_FORWARD_URL: http://backend:8000/api/v1/auth/register
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
