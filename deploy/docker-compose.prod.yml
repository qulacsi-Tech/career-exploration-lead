# Production stack for one EC2 host. Run from the deploy/ folder:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Step by step: docs/deployment-guide.md

name: career-platform

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: leadgendb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" here. The database is never reachable from outside the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadgendb"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    depends_on:
      db:
        condition: service_healthy
    # Internal only: Caddy is the sole client. No "ports:" here.
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
      args:
        # Public address the browser will call, baked in at build time.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      # Server-side form forwarding goes straight to the backend on the internal network.
      ENQUIRY_FORWARD_URL: http://backend:8000/api/v1/leads
      REGISTER_FORWARD_URL: http://backend:8000/api/v1/auth/register
    depends_on:
      - backend
    expose:
      - "3000"

  # Internal HTTP router. TLS is terminated by Cloudflare; see the tunnel section
  # of docs/deployment-guide.md. Nothing is published on the host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    expose:
      - "80"

  # Outbound-only connector: Cloudflare sends the domain's traffic down this link.
  # No inbound ports are needed on the server.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
