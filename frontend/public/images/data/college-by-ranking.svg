<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="gradRankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="gradPodium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce4355" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="gradBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadowRank" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ce4355" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="160" height="160" rx="24" fill="url(#gradRankBg)" />
  <circle cx="130" cy="30" r="40" fill="#ce4355" fill-opacity="0.08" />

  <!-- Podium Base -->
  <g filter="url(#shadowRank)">
    <!-- 2nd place podium (left) -->
    <rect x="25" y="80" width="34" height="48" rx="6" fill="url(#gradSilver)" />
    <text x="42" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">2</text>
    
    <!-- 1st place podium (center) -->
    <rect x="63" y="60" width="34" height="68" rx="6" fill="url(#gradPodium)" />
    <text x="80" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <!-- 3rd place podium (right) -->
    <rect x="101" y="92" width="34" height="36" rx="6" fill="url(#gradBronze)" />
    <text x="118" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">3</text>
  </g>

  <!-- Trophy on top of 1st place -->
  <g transform="translate(68, 25)">
    <!-- Trophy Cup -->
    <path d="M4 6 C4 18 20 18 20 6 Z" fill="url(#gradGold)" />
    <path d="M4 8 C-1 8 -1 13 4 14" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M20 8 C25 8 25 13 20 14" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" />
    <rect x="10" y="17" width="4" height="6" fill="#d97706" />
    <rect x="7" y="23" width="10" height="3" rx="1.5" fill="#b45309" />
    <!-- Star on trophy -->
    <polygon points="12,8 13.2,11.2 16.5,11.2 13.8,13.2 14.8,16.5 12,14.5 9.2,16.5 10.2,13.2 7.5,11.2 10.8,11.2" fill="#ffffff" opacity="0.9" transform="scale(0.6) translate(8, 2)" />
  </g>

  <!-- Laurel leaf / sparkles -->
  <circle cx="42" cy="40" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="118" cy="45" r="2.5" fill="#fbbf24" opacity="0.8" />
  <circle cx="130" cy="65" r="2" fill="#fbbf24" opacity="0.6" />
</svg>
