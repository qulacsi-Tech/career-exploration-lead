<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="gradRankPredBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="gradBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="gradBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="gradBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ce4355" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="gradBar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gradArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowRankPred" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#10b981" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="160" height="160" rx="24" fill="url(#gradRankPredBg)" />
  <circle cx="130" cy="130" r="35" fill="#10b981" fill-opacity="0.08" />

  <!-- Analytics Chart & Upward Rocket/Arrow -->
  <g filter="url(#shadowRankPred)">
    <!-- Base Axis -->
    <line x1="26" y1="126" x2="134" y2="126" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Chart Bars -->
    <rect x="34" y="96" width="18" height="28" rx="4" fill="url(#gradBar1)" />
    <rect x="58" y="76" width="18" height="48" rx="4" fill="url(#gradBar2)" />
    <rect x="82" y="52" width="18" height="72" rx="4" fill="url(#gradBar3)" />
    <rect x="106" y="32" width="18" height="92" rx="4" fill="url(#gradBar4)" />

    <!-- Trend line over bars -->
    <path d="M43 90 L67 70 L91 46 L115 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Data points -->
    <circle cx="43" cy="90" r="4.5" fill="#64748b" stroke="#ffffff" stroke-width="2" />
    <circle cx="67" cy="70" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
    <circle cx="91" cy="46" r="4.5" fill="#ce4355" stroke="#ffffff" stroke-width="2" />
    <circle cx="115" cy="26" r="5.5" fill="#059669" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Top Rank Badge #1 -->
    <g transform="translate(110, 16)">
      <polygon points="12,0 24,6 24,18 12,24 0,18 0,6" fill="#f59e0b" />
      <text x="12" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">#1</text>
    </g>
  </g>
</svg>
