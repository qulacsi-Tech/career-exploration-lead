<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <defs>
    <linearGradient id="pgradDataBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pgradDataChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="pgradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="480" height="270" fill="url(#pgradDataBg)" />
  <circle cx="240" cy="135" r="140" fill="url(#pgradGlow)" />

  <!-- Data Analytics Visualization / Modern Dashboard UI -->
  <g transform="translate(60, 40)">
    <!-- Monitor / Big Dashboard Frame -->
    <rect width="360" height="190" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="2" />
    
    <!-- Top Bar -->
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="55" cy="22" r="5" fill="#10b981" />
    <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">MS IN DATA ANALYTICS</text>

    <!-- Data Stream / Neural Net / Wave Graph -->
    <path d="M 30 140 Q 90 70 150 110 T 270 90 T 330 60" fill="none" stroke="#38bdf8" stroke-width="3.5" />
    <path d="M 30 155 Q 90 100 150 135 T 270 115 T 330 90" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4,4" />

    <!-- Area Fill Under Curve -->
    <path d="M 30 140 Q 90 70 150 110 T 270 90 T 330 60 L 330 160 L 30 160 Z" fill="url(#pgradDataChart)" opacity="0.15" />

    <!-- Floating Metric Cards -->
    <g transform="translate(30, 45)">
      <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">ACCURACY</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">99.4%</text>
    </g>

    <g transform="translate(135, 45)">
      <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">ALGORITHMS</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#818cf8">AI / ML</text>
    </g>

    <g transform="translate(240, 45)">
      <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#ce4355" stroke-width="1" />
      <text x="12" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">MODE</text>
      <text x="12" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">HYBRID</text>
    </g>
  </g>
</svg>
