<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <defs>
    <linearGradient id="pgradBizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pgradGoldChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pgradRoseChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ce4355" />
    </linearGradient>
  </defs>

  <rect width="480" height="270" fill="url(#pgradBizBg)" />

  <!-- Business Analytics Visual -->
  <g transform="translate(60, 40)">
    <rect width="360" height="190" rx="14" fill="#09090b" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Top Bar -->
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="55" cy="22" r="5" fill="#10b981" />
    <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#a1a1aa">MS IN BUSINESS ANALYTICS</text>

    <!-- Candlestick / Finance Growth Chart -->
    <g transform="translate(30, 50)">
      <!-- Grid Lines -->
      <line x1="0" y1="30" x2="300" y2="30" stroke="#27272a" stroke-width="1" />
      <line x1="0" y1="65" x2="300" y2="65" stroke="#27272a" stroke-width="1" />
      <line x1="0" y1="100" x2="300" y2="100" stroke="#27272a" stroke-width="1" />

      <!-- Bars -->
      <rect x="20" y="70" width="18" height="40" rx="3" fill="#52525b" />
      <rect x="55" y="55" width="18" height="55" rx="3" fill="url(#pgradGoldChart)" />
      <rect x="90" y="40" width="18" height="70" rx="3" fill="#52525b" />
      <rect x="125" y="30" width="18" height="80" rx="3" fill="url(#pgradRoseChart)" />
      <rect x="160" y="20" width="18" height="90" rx="3" fill="url(#pgradGoldChart)" />
      <rect x="195" y="10" width="18" height="100" rx="3" fill="url(#pgradRoseChart)" />

      <!-- Trend Forecast Arrow -->
      <path d="M 25 75 L 65 60 L 100 45 L 135 32 L 170 22 L 205 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <polygon points="215,8 200,10 206,20" fill="#ffffff" />
    </g>

    <!-- Stat Pill -->
    <g transform="translate(260, 95)">
      <rect width="80" height="55" rx="8" fill="#18181b" stroke="#ce4355" stroke-width="1" />
      <text x="40" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a1a1aa" text-anchor="middle">ROI BOOST</text>
      <text x="40" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f43f5e" text-anchor="middle">+145%</text>
    </g>
  </g>
</svg>
