<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <defs>
    <linearGradient id="pgradPgdmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="pgradBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="480" height="270" fill="url(#pgradPgdmBg)" />

  <!-- Management Diploma Executive Visual -->
  <g transform="translate(60, 40)">
    <rect width="360" height="190" rx="14" fill="#0f172a" stroke="#4338ca" stroke-width="2" />
    
    <!-- Top Bar -->
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="55" cy="22" r="5" fill="#10b981" />
    <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe">PG DIPLOMA IN MANAGEMENT</text>

    <!-- Leadership / Boardroom / Global Network Graphic -->
    <g transform="translate(40, 50)">
      <!-- World / Network Globe Nodes -->
      <circle cx="90" cy="65" r="45" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3" />
      <circle cx="90" cy="65" r="28" fill="none" stroke="#818cf8" stroke-width="1.5" />
      
      <!-- Nodes -->
      <circle cx="90" cy="20" r="5" fill="#38bdf8" />
      <circle cx="90" cy="110" r="5" fill="#38bdf8" />
      <circle cx="45" cy="65" r="5" fill="#38bdf8" />
      <circle cx="135" cy="65" r="5" fill="#38bdf8" />
      <circle cx="60" cy="35" r="4" fill="#fbbf24" />
      <circle cx="120" cy="95" r="4" fill="#fbbf24" />

      <!-- Center Icon -->
      <circle cx="90" cy="65" r="14" fill="#4f46e5" />
      <polygon points="86,60 94,60 97,67 94,74 86,74 83,67" fill="#ffffff" />
    </g>

    <!-- Executive Features -->
    <g transform="translate(200, 55)">
      <!-- Item 1 -->
      <circle cx="12" cy="15" r="6" fill="#10b981" />
      <path d="M 9 15 L 11 17 L 15 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Global Accreditation</text>

      <!-- Item 2 -->
      <circle cx="12" cy="45" r="6" fill="#10b981" />
      <path d="M 9 45 L 11 47 L 15 43" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <text x="26" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Executive Mentorship</text>

      <!-- Item 3 -->
      <circle cx="12" cy="75" r="6" fill="#10b981" />
      <path d="M 9 75 L 11 77 L 15 73" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <text x="26" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">100% Placement Track</text>

      <!-- Golden Seal Badge -->
      <g transform="translate(20, 95)">
        <rect width="115" height="24" rx="12" fill="url(#pgradBadge)" />
        <text x="57" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#78350f" text-anchor="middle">AICTE APPROVED</text>
      </g>
    </g>
  </g>
</svg>
