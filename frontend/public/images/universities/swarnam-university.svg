<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="skySwarnam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="techBldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="400" height="250" fill="url(#skySwarnam)" />

  <!-- Innovation Campus & Tech Dome (Swarnam University) -->
  <!-- Geodesic Tech Dome -->
  <g transform="translate(200, 110)">
    <path d="M -70 60 A 70 70 0 0 1 70 60 Z" fill="url(#glowDome)" opacity="0.9" />
    <!-- Dome Hexagonal Lattice -->
    <path d="M 0 -10 L -35 25 L 35 25 Z" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M -35 25 L -70 60 L 0 60 Z" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 35 25 L 0 60 L 70 60 Z" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 0 -10 L 0 60" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Left Tech Complex -->
  <rect x="40" y="80" width="100" height="90" rx="4" fill="url(#techBldg)" />
  <g fill="#38bdf8" opacity="0.8">
    <rect x="55" y="95" width="15" height="15" rx="2" />
    <rect x="80" y="95" width="15" height="15" rx="2" />
    <rect x="105" y="95" width="15" height="15" rx="2" />
    <rect x="55" y="125" width="15" height="15" rx="2" />
    <rect x="80" y="125" width="15" height="15" rx="2" />
    <rect x="105" y="125" width="15" height="15" rx="2" />
  </g>

  <!-- Right Tech Complex -->
  <rect x="260" y="80" width="100" height="90" rx="4" fill="url(#techBldg)" />
  <g fill="#38bdf8" opacity="0.8">
    <rect x="280" y="95" width="15" height="15" rx="2" />
    <rect x="305" y="95" width="15" height="15" rx="2" />
    <rect x="330" y="95" width="15" height="15" rx="2" />
    <rect x="280" y="125" width="15" height="15" rx="2" />
    <rect x="305" y="125" width="15" height="15" rx="2" />
    <rect x="330" y="125" width="15" height="15" rx="2" />
  </g>

  <!-- Ground & Tech Lawn -->
  <polygon points="0,170 400,170 400,250 0,250" fill="#065f46" />
  <polygon points="120,250 170,170 230,170 280,250" fill="#334155" />
  <line x1="200" y1="170" x2="200" y2="250" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" />
</svg>
