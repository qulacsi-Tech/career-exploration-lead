<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="skyClark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="hallClark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="lawnClark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <rect width="400" height="250" fill="url(#skyClark)" />
  <circle cx="340" cy="50" r="25" fill="#fef08a" opacity="0.9" />

  <!-- Clock Tower Centerpiece -->
  <g transform="translate(180, 20)">
    <rect x="0" y="40" width="40" height="130" rx="3" fill="url(#hallClark)" />
    <!-- Spire -->
    <polygon points="-5,40 20,5 45,40" fill="#451a03" />
    <polygon points="17,5 20,-5 23,5" fill="#f59e0b" />
    <!-- Clock face -->
    <circle cx="20" cy="60" r="10" fill="#ffffff" stroke="#78350f" stroke-width="2" />
    <line x1="20" y1="60" x2="20" y2="53" stroke="#1e293b" stroke-width="1.5" />
    <line x1="20" y1="60" x2="25" y2="60" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- Left Main Academic Wing -->
  <rect x="50" y="85" width="135" height="85" rx="3" fill="url(#hallClark)" />
  <!-- Windows Left -->
  <g fill="#fef08a">
    <rect x="65" y="100" width="16" height="22" rx="2" />
    <rect x="95" y="100" width="16" height="22" rx="2" />
    <rect x="125" y="100" width="16" height="22" rx="2" />
    <rect x="155" y="100" width="16" height="22" rx="2" />
    <rect x="65" y="135" width="16" height="22" rx="2" />
    <rect x="95" y="135" width="16" height="22" rx="2" />
    <rect x="125" y="135" width="16" height="22" rx="2" />
    <rect x="155" y="135" width="16" height="22" rx="2" />
  </g>

  <!-- Right Main Academic Wing -->
  <rect x="215" y="85" width="135" height="85" rx="3" fill="url(#hallClark)" />
  <!-- Windows Right -->
  <g fill="#fef08a">
    <rect x="230" y="100" width="16" height="22" rx="2" />
    <rect x="260" y="100" width="16" height="22" rx="2" />
    <rect x="290" y="100" width="16" height="22" rx="2" />
    <rect x="320" y="100" width="16" height="22" rx="2" />
    <rect x="230" y="135" width="16" height="22" rx="2" />
    <rect x="260" y="135" width="16" height="22" rx="2" />
    <rect x="290" y="135" width="16" height="22" rx="2" />
    <rect x="320" y="135" width="16" height="22" rx="2" />
  </g>

  <!-- Green Lawn and Pathway -->
  <polygon points="0,170 400,170 400,250 0,250" fill="url(#lawnClark)" />
  <polygon points="130,250 185,170 215,170 270,250" fill="#e2e8f0" />

  <!-- Trees -->
  <circle cx="35" cy="165" r="24" fill="#15803d" />
  <circle cx="365" cy="165" r="24" fill="#15803d" />
</svg>
