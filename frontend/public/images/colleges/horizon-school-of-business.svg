<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="skyHsb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="glassHsb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="wallHsb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="grassHsb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#skyHsb)" />
  <circle cx="330" cy="60" r="30" fill="#fef08a" opacity="0.8" />

  <!-- Background campus silhouette -->
  <path d="M 0 190 L 50 170 L 120 170 L 150 185 L 250 160 L 320 160 L 400 190 L 400 300 L 0 300 Z" fill="#94a3b8" opacity="0.35" />

  <!-- Modern Business School Building (Horizon School of Business) -->
  <!-- Main Glass Tower -->
  <rect x="140" y="50" width="130" height="170" rx="4" fill="url(#glassHsb)" />
  <!-- Glass Window Grid -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.4">
    <line x1="140" y1="80" x2="270" y2="80" />
    <line x1="140" y1="110" x2="270" y2="110" />
    <line x1="140" y1="140" x2="270" y2="140" />
    <line x1="140" y1="170" x2="270" y2="170" />
    <line x1="140" y1="200" x2="270" y2="200" />
    <line x1="170" y1="50" x2="170" y2="220" />
    <line x1="205" y1="50" x2="205" y2="220" />
    <line x1="240" y1="50" x2="240" y2="220" />
  </g>
  <!-- Architectural Cantilever / Canopy -->
  <polygon points="120,100 270,75 290,95 140,120" fill="#ce4355" opacity="0.85" />

  <!-- Left Wing -->
  <rect x="40" y="110" width="110" height="110" rx="3" fill="url(#wallHsb)" />
  <!-- Windows -->
  <g fill="#0284c7" opacity="0.7">
    <rect x="55" y="125" width="20" height="20" rx="2" />
    <rect x="85" y="125" width="20" height="20" rx="2" />
    <rect x="115" y="125" width="20" height="20" rx="2" />
    <rect x="55" y="160" width="20" height="20" rx="2" />
    <rect x="85" y="160" width="20" height="20" rx="2" />
    <rect x="115" y="160" width="20" height="20" rx="2" />
  </g>

  <!-- Right Wing -->
  <rect x="260" y="120" width="100" height="100" rx="3" fill="url(#wallHsb)" />
  <g fill="#0284c7" opacity="0.7">
    <rect x="280" y="135" width="20" height="20" rx="2" />
    <rect x="315" y="135" width="20" height="20" rx="2" />
    <rect x="280" y="170" width="20" height="20" rx="2" />
    <rect x="315" y="170" width="20" height="20" rx="2" />
  </g>

  <!-- Grand Entrance -->
  <rect x="175" y="185" width="60" height="35" rx="2" fill="#0f172a" />
  <polygon points="160,185 205,170 250,185" fill="#ce4355" />

  <!-- Foreground Plaza & Landscaping -->
  <polygon points="0,220 400,220 400,300 0,300" fill="url(#grassHsb)" />
  <polygon points="120,300 175,220 235,220 280,300" fill="#e2e8f0" />
  
  <!-- Trees -->
  <!-- Left Tree -->
  <circle cx="35" cy="210" r="28" fill="#16a34a" />
  <circle cx="20" cy="195" r="20" fill="#22c55e" />
  <rect x="30" y="225" width="10" height="30" fill="#78350f" />
  <!-- Right Tree -->
  <circle cx="365" cy="215" r="28" fill="#16a34a" />
  <circle cx="380" cy="200" r="20" fill="#22c55e" />
  <rect x="360" y="230" width="10" height="30" fill="#78350f" />

  <!-- Students walking -->
  <circle cx="195" cy="245" r="4" fill="#1e293b" />
  <path d="M 191 251 L 199 251 L 201 270 L 189 270 Z" fill="#ce4355" />
  
  <circle cx="215" cy="248" r="4" fill="#1e293b" />
  <path d="M 211 254 L 219 254 L 221 272 L 209 272 Z" fill="#0284c7" />
</svg>
