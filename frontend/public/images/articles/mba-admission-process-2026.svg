<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="artBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce4355" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="glowArt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce4355" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ce4355" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#artBg1)" />
  <circle cx="320" cy="80" r="120" fill="url(#glowArt1)" />

  <!-- Admission Form / Application Document -->
  <g transform="translate(60, 30)">
    <!-- Back Paper -->
    <rect x="20" y="10" width="140" height="170" rx="8" fill="#334155" transform="rotate(6 90 95)" />
    
    <!-- Main Application Document -->
    <rect x="0" y="0" width="150" height="180" rx="8" fill="#ffffff" />
    
    <!-- Document Header -->
    <rect x="15" y="18" width="80" height="8" rx="4" fill="#ce4355" />
    <rect x="15" y="32" width="50" height="4" rx="2" fill="#94a3b8" />
    
    <!-- Photo Box -->
    <rect x="105" y="15" width="30" height="35" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
    <circle cx="120" cy="27" r="6" fill="#94a3b8" />
    <path d="M 112 45 C 112 39 128 39 128 45" fill="#94a3b8" />

    <!-- Form Fields Lines -->
    <rect x="15" y="60" width="120" height="6" rx="3" fill="#e2e8f0" />
    <rect x="15" y="74" width="100" height="6" rx="3" fill="#e2e8f0" />
    <rect x="15" y="88" width="120" height="6" rx="3" fill="#e2e8f0" />
    <rect x="15" y="102" width="70" height="6" rx="3" fill="#e2e8f0" />

    <!-- Checkboxes -->
    <rect x="15" y="120" width="10" height="10" rx="2" fill="#10b981" />
    <path d="M17 125 L19 127 L23 122" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <rect x="32" y="123" width="60" height="4" rx="2" fill="#94a3b8" />

    <rect x="15" y="136" width="10" height="10" rx="2" fill="#10b981" />
    <path d="M17 141 L19 143 L23 138" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <rect x="32" y="139" width="75" height="4" rx="2" fill="#94a3b8" />

    <!-- Stamp APPROVED -->
    <g transform="translate(60, 105) rotate(-15)">
      <rect x="0" y="0" width="80" height="30" rx="4" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" />
      <text x="40" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="1">ADMITTED</text>
    </g>
  </g>

  <!-- Floating Calendar Badge -->
  <g transform="translate(240, 50)">
    <rect width="100" height="90" rx="12" fill="#ffffff" />
    <rect width="100" height="28" rx="12" fill="url(#gradCard1)" />
    <!-- Rings -->
    <circle cx="25" cy="8" r="3" fill="#ffffff" />
    <circle cx="75" cy="8" r="3" fill="#ffffff" />
    <text x="50" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ADMISSIONS 2026</text>
    <text x="50" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#1e293b" text-anchor="middle">OPEN</text>
    <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ce4355" text-anchor="middle">APPLY NOW</text>
  </g>

  <!-- Sparkles -->
  <circle cx="230" cy="180" r="3" fill="#fbbf24" />
  <circle cx="360" cy="170" r="4" fill="#fbbf24" />
</svg>
